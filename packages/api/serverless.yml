service: trace-stack

plugins:
  - serverless-esbuild
  - serverless-offline
  - serverless-domain-manager
  - serverless-plugin-log-retention

params:
  default:
    DATA_RETENTION_DAYS: ${env:DATA_RETENTION_DAYS, 14}
    CUSTOM_DOMAIN: ${env:CUSTOM_DOMAIN, ""}
    HAS_CUSTOM_DOMAIN: ${strToBool(${env:HAS_CUSTOM_DOMAIN, "false"})}
    TRACER_TOKEN: ${env:TRACER_TOKEN, ""}

custom:
  customDomain:
    enabled: ${param:HAS_CUSTOM_DOMAIN}
    domainName: ${param:CUSTOM_DOMAIN}
    createRoute53Record: true
    autoDomain: true
    endpointType: regional
    apiType: http
  logRetentionInDays: 14
  bucketName: ${self:service}-storage-${sls:stage} # TODO: make this a unique name

package:
  individually: true
  include:
    - dist/**

useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  timeout: 25
  region: eu-west-1
  architecture: arm64
  deploymentMethod: direct
  versionFunctions: false
  stage: ${opt:stage, 'dev'}
  stackTags:
    service: ${self:service}
  environment:
    SERVICE: ${self:service}
    STAGE: ${sls:stage}
    DATA_RETENTION_DAYS: ${param:DATA_RETENTION_DAYS}
    API_GATEWAY_NAME: ${sls:stage}-${self:service}
    NODE_ENV: ${sls:stage}
    TABLE_NAME: ${self:service}-${sls:stage}
    CUSTOM_DOMAIN: ${param:CUSTOM_DOMAIN}
    TRACER_TOKEN: ${param:TRACER_TOKEN}
    LAMBDA_LAYER_ARN: !Ref TracerLambdaLayer
    AUTO_TRACE_EXCLUDE: 1
    STORAGE_BUCKET_NAME: ${self:custom.bucketName}
  httpApi:
    payload: "2.0"
    cors: true
  lambdaHashingVersion: 20201221
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:*
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:service}-${sls:stage}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:service}-${sls:stage}/index/*
        - Effect: Allow
          Action:
            - lambda:ListFunctions
            - lambda:UpdateFunctionConfiguration
            - lambda:GetLayerVersion
            - lambda:GetFunction
            - lambda:GetFunctionUrlConfig
            - lambda:ListTags
          Resource:
            - "*"
        - Effect: Allow
          Action:
            - logs:GetLogEvents
            - logs:DescribeLogGroups
            - logs:DescribeLogStreams
          Resource:
            - "*"
        - Effect: Allow
          Action:
            - apigateway:GET
          Resource:
            - "arn:aws:apigateway:${aws:region}::/apis"
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::${self:custom.bucketName}
            - arn:aws:s3:::${self:custom.bucketName}/*

layers:
  tracer:
    path: ../lambda-layer/artifact
    name: ${self:service}-layer
    description: Auto-tracing layer for your functions
    compatibleRuntimes:
      - nodejs16.x
      - nodejs18.x
      - nodejs20.x
      - nodejs22.x

functions:
  main:
    handler: src/index.handler
    timeout: 900
    memorySize: 1024
    reservedConcurrency: 1
    url: true
    events:
      - httpApi:
          path: /{proxy+}
          method: any
      - schedule:
          rate: rate(2 hours)
          input:
            action: auto-trace

resources:
  - ${file(./src/infrastructure/database/table.yml)}
  - ${file(./src/infrastructure/bucket.yml)}